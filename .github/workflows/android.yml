name: QQMusic Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'QQMusic-v0.3.1-GitHub-ready-source*.zip'
      - 'source/**'
      - 'app/**'
      - '*.gradle.kts'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android source
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(QQMusic-v0.3.1-GitHub-ready-source*.zip)
          if [ "${#archives[@]}" -gt 0 ]; then
            echo "Extracting ${archives[0]}"
            unzip -oq "${archives[0]}" -d .
          fi
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/shuocao/qqmusic/MainActivity.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test and build debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QQMusic-v0.3.1-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
