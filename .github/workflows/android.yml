name: QQMusic Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'QQMusic-v0.3.1-GitHub-ready-source*.zip'
      - 'source/**'
      - 'app/**'
      - '*.gradle.kts'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android source
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(QQMusic-v0.3.1-GitHub-ready-source*.zip)
          if [ "${#archives[@]}" -gt 0 ]; then
            echo "Extracting ${archives[0]}"
            unzip -oq "${archives[0]}" -d .
          fi
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/shuocao/qqmusic/MainActivity.kt
          # The archived prototype used 2026 dependencies requiring SDK 37 / AGP 9.1.
          # Pin compatible AndroidX versions until the source archive is replaced.
          sed -i 's/compose-bom:2026.09.00/compose-bom:2025.06.01/g' app/build.gradle.kts
          sed -i 's/activity-compose:1.13.0/activity-compose:1.10.1/g' app/build.gradle.kts
          sed -i 's/lifecycle-runtime-ktx:2.11.0/lifecycle-runtime-ktx:2.9.2/g' app/build.gradle.kts
          sed -i 's/media3-exoplayer:1.11.1/media3-exoplayer:1.8.0/g; s/media3-session:1.11.1/media3-session:1.8.0/g' app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test and build debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QQMusic-v0.3.1-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
