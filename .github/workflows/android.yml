name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check source completeness
        shell: bash
        run: |
          test -f app/build.gradle.kts
          test -f settings.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/shuocao/qqmusic/MainActivity.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: QQMusic-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
